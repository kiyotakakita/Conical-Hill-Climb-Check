<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二重円錐の登坂判定シミュレーター</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1e1e2f;
    color: #f0f0f5;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    max-width: 800px;
    width: 100%;
    background: #27293d;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  h1 { font-size: 1.4rem; text-align: center; margin-top: 0; }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  @media (max-width: 600px) {
    .controls { grid-template-columns: 1fr; }
  }
  .control-group {
    background: #1f2030;
    padding: 12px 16px;
    border-radius: 8px;
  }
  label {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-bottom: 6px;
  }
  input[type=range] {
    width: 100%;
    accent-color: #4facfe;
  }
  .val { font-weight: bold; color: #4facfe; }

  /* 判定バナー */
  .result-banner {
    padding: 14px;
    text-align: center;
    border-radius: 8px;
    font-size: 1.15rem;
    font-weight: bold;
    margin-bottom: 16px;
    transition: all 0.3s;
  }
  .success { background: rgba(46, 204, 113, 0.2); border: 2px solid #2ecc71; color: #2ecc71; }
  .fail { background: rgba(231, 76, 60, 0.2); border: 2px solid #e74c3c; color: #e74c3c; }

  canvas {
    width: 100%;
    background: #161622;
    border-radius: 8px;
    display: block;
  }
  .info-box {
    margin-top: 16px;
    font-size: 0.85rem;
    color: #a0a5b8;
    line-height: 1.6;
    background: #1f2030;
    padding: 12px;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>反重力コーン（二重円錐）登坂シミュレーター</h1>

  <!-- 判定結果 -->
  <div id="resultBanner" class="result-banner success">判定中...</div>

  <div class="controls">
    <!-- 坂の傾斜角 -->
    <div class="control-group">
      <label>坂の傾斜角 θ (レール傾き) <span id="thetaVal" class="val">5.0°</span></label>
      <input type="range" id="theta" min="0.5" max="25" step="0.1" value="5.0">
    </div>

    <!-- レールの開き角 -->
    <div class="control-group">
      <label>レールの開き角 2φ (上からの広がり) <span id="phiVal" class="val">20.0°</span></label>
      <input type="range" id="phi" min="2" max="50" step="0.5" value="20.0">
    </div>

    <!-- 円錐の半径 -->
    <div class="control-group">
      <label>円錐の最大半径 R <span id="rVal" class="val">40 mm</span></label>
      <input type="range" id="radius" min="15" max="80" step="1" value="40">
    </div>

    <!-- 円錐の半分の長さ -->
    <div class="control-group">
      <label>円錐の半長 L (中心から先端) <span id="lVal" class="val">60 mm</span></label>
      <input type="range" id="length" min="30" max="100" step="1" value="60">
    </div>
  </div>

  <canvas id="simCanvas" width="750" height="320"></canvas>

  <div class="info-box">
    <b>【物理条件】</b> 登るための条件: <code>tan(θ) &lt; tan(φ) × (R / L)</code><br>
    ・<b>θ (シータ)</b>: 坂の傾斜（レールの仰角）<br>
    ・<b>φ (ファイ)</b>: 中心線からのレールの片側開き角（開き角の半分）<br>
    ・<b>R / L</b>: 円錐の傾斜（半径 ÷ 半長）<br>
    坂の傾斜 $\theta$ を急にするほど、それと比例して<b>円錐を太くする（$R/L$ を大きくする）</b>か<b>レールの開き角（$2\phi$）を広げる</b>必要があります。
  </div>
</div>

<script>
  const thetaSlider = document.getElementById('theta');
  const phiSlider = document.getElementById('phi');
  const rSlider = document.getElementById('radius');
  const lSlider = document.getElementById('length');

  const thetaVal = document.getElementById('thetaVal');
  const phiVal = document.getElementById('phiVal');
  const rVal = document.getElementById('rVal');
  const lVal = document.getElementById('lVal');

  const banner = document.getElementById('resultBanner');
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');

  let animT = 0; // アニメーション進捗

  function update() {
    const thetaDeg = parseFloat(thetaSlider.value);
    const twoPhiDeg = parseFloat(phiSlider.value);
    const R = parseFloat(rSlider.value);
    const L = parseFloat(lSlider.value);

    thetaVal.textContent = thetaDeg.toFixed(1) + '°';
    phiVal.textContent = twoPhiDeg.toFixed(1) + '°';
    rVal.textContent = R + ' mm';
    lVal.textContent = L + ' mm';

    const theta = thetaDeg * Math.PI / 180;
    const phi = (twoPhiDeg / 2) * Math.PI / 180;
    const coneSlope = R / L; // tan(円錐の半角)

    // 登る条件: レールの沈み込み勾配 (tan(phi)*coneSlope) > 坂の勾配 (tan(theta))
    const dropRate = Math.tan(phi) * coneSlope;
    const riseRate = Math.tan(theta);
    const canRollUphill = dropRate > riseRate;

    // 必要最小限のR/L (円錐の太さ比)
    const minConeSlope = riseRate / Math.tan(phi);
    const minR = (minConeSlope * L).toFixed(1);

    if (canRollUphill) {
      banner.className = 'result-banner success';
      banner.innerHTML = `○ ひとりでに坂を登ります！（重心が沈む条件を満たしています）<br>
        <span style="font-size:0.85rem; font-weight:normal;">10cm登るごとに重心は <b>${((dropRate - riseRate) * 100).toFixed(1)} mm</b> 下がります</span>`;
    } else {
      banner.className = 'result-banner fail';
      banner.innerHTML = `✕ 登れません（坂を下って転がり落ちます）<br>
        <span style="font-size:0.85rem; font-weight:normal;">現在の傾斜で登るには、円錐の半径 R が <b>${minR} mm</b> 以上必要です</span>`;
    }

    draw(theta, phi, R, L, canRollUphill);
  }

  function draw(theta, phi, R, L, canRollUphill) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // アニメーション進行
    if (canRollUphill) {
      animT += 0.008;
      if (animT > 1) animT = 0;
    } else {
      animT -= 0.008;
      if (animT < 0) animT = 1;
    }

    // --- 左側: 横から見た図（レールと重心の高さ） ---
    const sideX = 50, sideY = 220;
    const railLen = 260;

    // レール
    const railEndX = sideX + railLen * Math.cos(theta);
    const railEndY = sideY - railLen * Math.sin(theta);

    ctx.strokeStyle = '#888';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(sideX, sideY);
    ctx.lineTo(railEndX, railEndY);
    ctx.stroke();

    // 水平補助線
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sideX, sideY);
    ctx.lineTo(sideX + railLen, sideY);
    ctx.stroke();
    ctx.setLineDash([]);

    // 円錐の位置 (横)
    const currentDist = railLen * (0.15 + animT * 0.7);
    const coneX = sideX + currentDist * Math.cos(theta);
    const coneRailY = sideY - currentDist * Math.sin(theta);

    // 沈み込み量 (沈降)
    const currentRailHalfWidth = (currentDist * Math.tan(phi));
    const effectiveRadius = Math.max(2, R - currentRailHalfWidth * (R / L));
    const cmY = coneRailY - effectiveRadius; // 重心位置

    // 重心(CM)の軌跡線
    const startCMY = sideY - (R - (railLen * 0.15 * Math.tan(phi)) * (R/L));
    const endCMY = (sideY - railLen * 0.85 * Math.sin(theta)) - (R - (railLen * 0.85 * Math.tan(phi)) * (R/L));
    ctx.strokeStyle = canRollUphill ? 'rgba(46, 204, 113, 0.5)' : 'rgba(231, 76, 60, 0.5)';
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(sideX + railLen * 0.15 * Math.cos(theta), startCMY);
    ctx.lineTo(sideX + railLen * 0.85 * Math.cos(theta), endCMY);
    ctx.stroke();
    ctx.setLineDash([]);

    // 二重円錐 (横図: 楕円/円)
    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.arc(coneX, cmY, effectiveRadius, 0, Math.PI * 2);
    ctx.fill();

    // 重心マーク
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(coneX, cmY, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#aaa';
    ctx.font = '12px sans-serif';
    ctx.fillText('【横から見た図】', sideX, 50);
    ctx.fillStyle = canRollUphill ? '#2ecc71' : '#e74c3c';
    ctx.fillText(canRollUphill ? '重心は下に向かって移動 ↓' : '重心が上がるため逆戻り ↑', sideX, 70);

    // --- 右側: 上から見た図（V字レールと二重円錐） ---
    const topCenterX = 560;
    const topStartY = 240;
    const topLen = 180;

    const startW = topLen * 0.15 * Math.tan(phi);
    const endW = topLen * 0.85 * Math.tan(phi);

    ctx.strokeStyle = '#888';
    ctx.lineWidth = 4;
    // V字レール
    ctx.beginPath();
    ctx.moveTo(topCenterX - startW, topStartY);
    ctx.lineTo(topCenterX - endW, topStartY - topLen);
    ctx.moveTo(topCenterX + startW, topStartY);
    ctx.lineTo(topCenterX + endW, topStartY - topLen);
    ctx.stroke();

    // 二重円錐 (上から見た図)
    const coneTopY = topStartY - topLen * (0.15 + animT * 0.7);
    ctx.fillStyle = 'rgba(243, 156, 18, 0.85)';
    ctx.beginPath();
    // ひし形（二重円錐の投影）
    ctx.moveTo(topCenterX, coneTopY - R * 0.6); // 前端
    ctx.lineTo(topCenterX + L * 1.3, coneTopY); // 右先端
    ctx.lineTo(topCenterX, coneTopY + R * 0.6); // 後端
    ctx.lineTo(topCenterX - L * 1.3, coneTopY); // 左先端
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#d35400';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#aaa';
    ctx.fillText('【上から見た図 (V字レール)】', topCenterX - 90, 50);
  }

  [thetaSlider, phiSlider, rSlider, lSlider].forEach(el => {
    el.addEventListener('input', update);
  });

  function loop() {
    update();
    requestAnimationFrame(loop);
  }
  loop();
</script>

</body>
</html>
